protocol_status: proposal_pending_review
seed: 42
arm: teacher
data:
  image_size:
  - 192
  - 320
  min_depth: 0.1
  max_depth: 1000.0
  depth_encoding: midair_float16_bits
  depth_scale: 1.0
  workers: 2
model:
  name: resnet50_depth
  pretrained: true
train:
  epochs: 20
  batch_size: 2
  effective_batch_size: 2
  accumulation_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: true
  amp_initial_scale: 1024.0
  lr_schedule:
    name: cosine
    t_max: 20
    eta_min: 1.0e-06
  encoder_learning_rate: 1.0e-05
loss:
  l1_weight: 1.0
  log_weight: 0.2
  gradient_weight: 0.1
  near_weight: 0.0
  near_threshold: 10.0
kd_weight: 0.0
