# Frozen after tuning only on the trajectory_2021 pilot validation split.
# This is not a final benchmark configuration; the held-out test split remains unused.
seed: 42
data:
  image_size: [192, 320]
  min_depth: 0.1
  max_depth: 1000.0
  depth_encoding: midair_float16_bits
  depth_scale: 1.0
  workers: 4
model:
  name: aerodepth_tiny
  base_channels: 24
train:
  epochs: 20
  batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: true
loss:
  l1_weight: 1.0
  log_weight: 0.2
  gradient_weight: 0.1
  near_weight: 0.1
  near_threshold: 10.0
scheduler:
  max_skip: 4
  decision_threshold: 0.34
  motion_weight: 0.25
  visual_weight: 0.30
  risk_weight: 0.30
  age_weight: 0.15
  motion_scale: 16.0
  visual_scale: 0.15
  near_threshold: 10.0
  critical_risk: 0.75
  extreme_motion: 0.9
  extreme_visual: 0.9
  visual_size: [36, 64]
replay:
  policies: [every, fixed2, fixed5, adaptive]
  critical_near_threshold: 8.0
  critical_change_threshold: 2.0
