name: CI

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CPU dependencies
        run: make install-cpu
      - name: Run tests
        run: make test
      - name: Run synthetic end-to-end workflow
        run: make smoke
