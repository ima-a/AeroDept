seed: 42
data:
  image_size:
  - 192
  - 320
  min_depth: 0.1
  max_depth: 1000.0
  depth_encoding: midair_float16_bits
  depth_scale: 1.0
  workers: 2
model:
  name: mobilenet_v3_small_depth
  pretrained: true
train:
  epochs: 50
  batch_size: 4
  learning_rate: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  amp: true
  lr_schedule:
    name: cosine
    t_max: 50
    eta_min: 3.0e-06
loss:
  l1_weight: 1.0
  log_weight: 0.2
  gradient_weight: 0.1
  near_weight: 0.0
  near_threshold: 10.0
scheduler:
  status: provisional_requires_validation_review
  max_skip: 2
  decision_threshold: 0.9
  motion_weight: 0.25
  visual_weight: 0.3
  risk_weight: 0.3
  age_weight: 0.15
  motion_scale: 5.0
  visual_scale: 0.15
  near_threshold: 10.0
  critical_risk: 0.9
  extreme_motion: 0.9
  extreme_visual: 0.9
  visual_size:
  - 36
  - 64
replay:
  status: provisional_requires_validation_review
  policies:
  - every
  critical_near_threshold: 8.0
  critical_change_threshold: 2.0
review:
  depth_range_approved: true
  replay_thresholds_approved: false
  depth_range_evidence: "artifacts/local/preparation/depth_range_review.json; 30 train/validation\
    \ frames; retain 0.1\u20131000m and existing losses"
  training_budget_policy: measured full epoch plus validation, 20% allowance, at most
    12 hours for 50 epochs
