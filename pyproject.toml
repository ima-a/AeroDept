[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aerodepth-lite"
version = "0.1.0"
description = "Safety-constrained adaptive inference for UAV monocular depth"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10",
  "PyYAML>=6",
  "matplotlib>=3.8",
  "torch>=2.2",
]

[project.optional-dependencies]
midair = ["h5py>=3.10"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
aerodepth = "aerodepth_lite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real MidAir dataset"]

